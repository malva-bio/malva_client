name: federation

# Federation is not available on the mainstream/free deployment, so this
# workflow is deliberately separate from ci.yml. The offline contract job runs
# when the `federation` label is added to a pull request; the live job only runs
# on demand or on the daily schedule.
on:
  workflow_dispatch:
  schedule:
    - cron: "37 4 * * *"
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  contract:
    if: github.event_name != 'pull_request' || github.event.label.name == 'federation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: >-
          uv run --no-project python -m pytest tests_federation -q
          -m "federation and not federation_live"

  live:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    # The federation-enabled Explorer is reachable from the organisation's
    # private network, so reuse the self-hosted runner like ci.yml's
    # integration job. Configure MALVA_FEDERATION_API_URL (variable),
    # MALVA_FEDERATION_API_TOKEN (secret) and optionally
    # MALVA_FEDERATION_GENE (variable).
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    env:
      MALVA_FEDERATION_API_URL: ${{ vars.MALVA_FEDERATION_API_URL }}
      MALVA_FEDERATION_API_TOKEN: ${{ secrets.MALVA_FEDERATION_API_TOKEN }}
      MALVA_FEDERATION_GENE: ${{ vars.MALVA_FEDERATION_GENE }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: >-
          uv run --no-project python -m pytest tests_federation -q
          -m federation_live --durations=10
