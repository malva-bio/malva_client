name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Runs on the organisation's self-hosted runner, configured through the
# MALVA_RUNNER_LABELS repository variable (same labels as the monorepo).
# Pull requests from forks fall back to GitHub-hosted runners: fork code is
# untrusted and must not run on the deployment host. When the variable is unset
# every job also falls back to ubuntu-latest.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# least privilege: every job only needs to read the repository
permissions:
  contents: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        run: |
          set -euo pipefail
          base=""
          head=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          if [ -z "$base" ] || [ -z "$head" ] || [[ "$base" =~ ^0+$ ]] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          merge_base=$(git merge-base "$base" "$head" 2>/dev/null || echo "$base")
          changed=$(git diff --name-only "$merge_base" "$head")
          if [ -z "$changed" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          docs_only=true
          while IFS= read -r file; do
            case "$file" in
              docs/*|*.md|.readthedocs.yaml) ;;
              *) docs_only=false ;;
            esac
          done <<< "$changed"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
    runs-on: ${{ fromJSON((github.event.pull_request.head.repo.fork && '["ubuntu-latest"]') || vars.MALVA_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: uv run --no-project ruff check .
      - run: uv run --no-project ruff format --check .

  typecheck:
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
    runs-on: ${{ fromJSON((github.event.pull_request.head.repo.fork && '["ubuntu-latest"]') || vars.MALVA_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: uv run --no-project ty check

  test:
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
    runs-on: ${{ fromJSON((github.event.pull_request.head.repo.fork && '["ubuntu-latest"]') || vars.MALVA_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv run --no-project python -m pytest -q --durations=25

  # statement coverage over the Python sources (reported, not gated).
  coverage:
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
    runs-on: ${{ fromJSON((github.event.pull_request.head.repo.fork && '["ubuntu-latest"]') || vars.MALVA_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: >-
          uv run --no-project python -m pytest -q
          --cov=malva_client --cov-report=xml:coverage.xml --cov-report=term-missing
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage-report
          path: coverage.xml
      # non-blocking: without a CODECOV_TOKEN the action still succeeds.
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # Hits the real Malva platform to check the configured endpoints. The tests
  # skip when MALVA_API_TOKEN is empty (e.g. fork pull requests), so this job
  # never fails for lack of credentials. Configure MALVA_API_TOKEN (secret) and
  # MALVA_API_URL (variable) under Settings -> Secrets and variables -> Actions.
  integration:
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
    runs-on: ${{ fromJSON((github.event.pull_request.head.repo.fork && '["ubuntu-latest"]') || vars.MALVA_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    env:
      MALVA_API_URL: ${{ vars.MALVA_API_URL }}
      MALVA_API_TOKEN: ${{ secrets.MALVA_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: uv run --no-project python -m pytest -q -m integration --durations=25

  # End-to-end smoke run of every public client feature against the deployed
  # server, including a reference query built from a bundled Scanpy dataset.
  # The Markdown/JSON report is uploaded even when the run fails so the result
  # can be inspected from the workflow run.
  live-check:
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
    runs-on: ${{ fromJSON((github.event.pull_request.head.repo.fork && '["ubuntu-latest"]') || vars.MALVA_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 45
    env:
      MALVA_API_URL: ${{ vars.MALVA_API_URL }}
      MALVA_API_TOKEN: ${{ secrets.MALVA_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: uv pip install scanpy
      - run: .venv/bin/python scripts/live_check.py --out reports
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: live-check-report
          path: reports

  required:
    name: required
    if: always()
    needs: [changes, lint, typecheck, test, coverage, integration, live-check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::a required job did not succeed"
          exit 1
