name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# pull_request runs on GitHub-hosted runners: pull-request code is untrusted and
# must not run on the deployment host. push to main runs on the sandboxed
# self-hosted runner provided at the organisation level (malva-bio).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# least privilege: every job only needs to read the repository
permissions:
  contents: read

jobs:
  lint:
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted","linux","x64"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: uv run --no-project ruff check .
      - run: uv run --no-project ruff format --check .

  typecheck:
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted","linux","x64"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: uv run --no-project ty check

  test:
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted","linux","x64"]') }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv run --no-project python -m pytest -q --durations=25

  # statement coverage over the Python sources (reported, not gated).
  coverage:
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted","linux","x64"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: >-
          uv run --no-project python -m pytest -q
          --cov=malva_client --cov-report=xml:coverage.xml --cov-report=term-missing
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage-report
          path: coverage.xml
      # non-blocking: without a CODECOV_TOKEN the action still succeeds.
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # Hits the real Malva platform to check the configured endpoints. The tests
  # skip when MALVA_API_TOKEN is empty (e.g. fork pull requests), so this job
  # never fails for lack of credentials. Configure MALVA_API_TOKEN (secret) and
  # MALVA_API_URL (variable) under Settings -> Secrets and variables -> Actions.
  integration:
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted","linux","x64"]') }}
    timeout-minutes: 30
    env:
      MALVA_API_URL: ${{ vars.MALVA_API_URL }}
      MALVA_API_TOKEN: ${{ secrets.MALVA_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: uv run --no-project python -m pytest -q -m integration --durations=25
